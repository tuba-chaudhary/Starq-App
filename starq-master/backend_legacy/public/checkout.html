<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>STARQ Checkout</title>
  <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
  <style>
    body { font-family: Inter, Arial, sans-serif; max-width: 480px; margin: 40px auto; color: #1d1f23; }
    .card { border: 1px solid #eee; border-radius: 16px; padding: 24px; }
    button { background: #d91f1e; color: #fff; border: 0; border-radius: 10px; padding: 14px 18px; width: 100%; font-size: 16px; }
    .err { color: #d91f1e; }
  </style>
</head>
<body>
  <div class="card">
    <h2>STARQ Payment</h2>
    <p id="status">Loading order…</p>
    <p class="err" id="error"></p>
    <button id="pay" style="display:none">Pay securely with Razorpay</button>
  </div>
  <script>
    const bookingId = location.pathname.split('/').pop();
    const token = new URLSearchParams(location.search).get('token');
    async function load() {
      const res = await fetch('/api/v1/payments/status/' + bookingId, {
        headers: token ? { Authorization: 'Bearer ' + token } : {},
      });
      const json = await res.json();
      if (!json.success) {
        document.getElementById('error').textContent = json.message || 'Unable to load payment';
        return;
      }
      const payment = json.data.payment;
      const booking = json.data.booking;
      if (booking.status !== 'PENDING_PAYMENT' && booking.status !== 'PAYMENT_PROCESSING' && booking.status !== 'PAYMENT_FAILED') {
        document.getElementById('status').textContent = 'Booking ' + booking.booking_number + ' is already ' + booking.status;
        return;
      }
      if (!payment || !payment.razorpay_order_id) {
        document.getElementById('error').textContent = 'No Razorpay order exists for this booking.';
        return;
      }
      document.getElementById('status').textContent = booking.booking_number + ' · ₹' + (payment.amount_in_paise / 100).toFixed(2);
      const payBtn = document.getElementById('pay');
      payBtn.style.display = 'block';
      const cfg = await fetch('/api/v1/payments/config').then((r) => r.json());
      payBtn.onclick = () => {
        const rzp = new Razorpay({
          key: cfg.data.key_id,
          amount: payment.amount_in_paise,
          currency: 'INR',
          order_id: payment.razorpay_order_id,
          name: 'STARQ',
          description: 'Doorstep vehicle care',
          handler: async function (response) {
            const verify = await fetch('/api/v1/payments/checkout-verify', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify(response),
            });
            const body = await verify.json();
            document.getElementById('status').textContent = body.success
              ? 'Payment verified. Booking ' + body.data.booking_number + ' is ' + body.data.status
              : (body.message || 'Verification failed');
          },
        });
        rzp.open();
      };
    }
    load().catch((e) => document.getElementById('error').textContent = 'Failed to start checkout');
  </script>
</body>
</html>
