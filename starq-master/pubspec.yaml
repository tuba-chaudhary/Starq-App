name: starq_app
description: "STARQ Car Wash Application"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  cached_network_image: ^3.4.1
  dio: ^5.8.0+1
  flutter_dotenv: ^5.2.1
  flutter_secure_storage: ^9.2.4
  geolocator: ^13.0.2
  go_router: ^14.8.1
  google_fonts: ^6.2.1
  google_maps_flutter: ^2.10.1
  intl: ^0.19.0
  provider: ^6.1.2
  razorpay_flutter: ^1.4.0
  shared_preferences: ^2.5.2
  url_launcher: ^6.3.1
  share_plus: ^10.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - .env
    - .env.example
    - assets/images/
